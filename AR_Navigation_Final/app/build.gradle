import java.util.Properties

plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def configValue = { String name ->
    def environmentValue = System.getenv(name)
    def localValue = localProperties.getProperty(name)
    return environmentValue != null ? environmentValue : (localValue != null ? localValue : '')
}

def quotedBuildConfigValue = { String value ->
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def mapsApiKey = configValue('MAPS_API_KEY')
def placesApiKey = configValue('PLACES_API_KEY')
def tmapAppKey = configValue('TMAP_APP_KEY')
def tmapProxyBaseUrl = configValue('TMAP_PROXY_BASE_URL')

def routesApiKey = configValue('ROUTES_API_KEY')
def routesProxyBaseUrl = configValue('ROUTES_PROXY_BASE_URL')

android {
    namespace = 'com.example.arnavigation'
    compileSdk { version = release(36) { minorApiLevel = 1 } }

    defaultConfig {
        applicationId = 'com.example.arnavigation.finalapp'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '1.0.0'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
        buildConfigField 'String', 'MAPS_API_KEY', quotedBuildConfigValue(mapsApiKey)
        buildConfigField 'String', 'PLACES_API_KEY', quotedBuildConfigValue(placesApiKey)
        buildConfigField 'String', 'TMAP_APP_KEY', quotedBuildConfigValue(tmapAppKey)
        buildConfigField 'String', 'TMAP_PROXY_BASE_URL', quotedBuildConfigValue(tmapProxyBaseUrl)
        buildConfigField 'String', 'ROUTES_API_KEY', quotedBuildConfigValue(routesApiKey)
        buildConfigField 'String', 'ROUTES_PROXY_BASE_URL', quotedBuildConfigValue(routesProxyBaseUrl)
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    androidResources {
        noCompress += ['onnx']
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
        warningsAsErrors = false
        // Toolchain versions are deliberately pinned to the compatible Task 0 baseline.
        disable.add('AndroidGradlePluginVersion')
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all { systemProperty 'culture.references', file('src/main/assets/munhwagwan.json').absolutePath }
    }
}

dependencies {
    implementation project(':indoor')
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.11.0'
    implementation 'com.google.android.material:material:1.14.0'

    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.android.libraries.places:places:5.1.1'

    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.13.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
