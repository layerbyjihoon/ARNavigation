plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.example.entrancetransition'
    compileSdk = 36
    defaultConfig {
        applicationId = 'com.example.entrancetransition'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['onnx'] }
    lint { disable.add('AndroidGradlePluginVersion') }
    testOptions.unitTests.all {
        systemProperty 'culture.references', file('src/main/assets/munhwagwan.json').absolutePath
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    testImplementation 'junit:junit:4.13.2'
}
